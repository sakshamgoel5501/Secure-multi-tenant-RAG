services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${PG_PASSWORD:-rag}
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    # Match this tag to your client: run `pip show qdrant-client` and pick a nearby server version.
    image: qdrant/qdrant:${QDRANT_TAG:-v1.15.0}
    volumes: [qdrantdata:/qdrant/storage]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: on-failure
    ports: ["8000:8000"]
    environment:
      RAG_PG_DSN: postgresql://rag:${PG_PASSWORD:-rag}@postgres:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:-}      # empty = dev headers
      GCP_PROJECT: ${GCP_PROJECT:-}            # empty = fake LLM
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
    volumes:
      - modelcache:/app/.model_cache
      # Gemini from your Mac: uncomment to reuse your gcloud login. On a GCE VM, the attached
      # service account (role: Vertex AI User) is picked up automatically, so mount nothing.
      # - ~/.config/gcloud:/home/rag/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      start_period: 120s
      retries: 6

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  modelcache:



  